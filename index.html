<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .hero-slider-container {
    position: relative;
    width: 100%;
    aspect-ratio: 2.35 / 1;
    overflow: hidden;
    background-color: #EDE7DE;
  }
  .slider-track {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .slide-item { min-width: 100%; height: 100%; }
  .slide-item img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center; display: block;
  }
  .slider-dots {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%); display: flex; gap: 8px; z-index: 10;
  }
  .slider-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.6); cursor: pointer; transition: 0.3s;
  }
  .slider-dot.active {
    background: #D4AF37; width: 22px; border-radius: 10px;
  }
</style>

<div class="hero-slider-container" id="heroSlider">
  <div class="slider-track" id="sliderTrack">
    <div class="slide-item"><img src="https://i.pinimg.com/736x/02/99/eb/0299eb634a5d90fb6e3a84587c0b415a.jpg" alt="Slide 1" /></div>
    <div class="slide-item"><img src="https://i.pinimg.com/736x/59/0c/93/590c9307d61abbafaa9f0a2b6069115d.jpg" alt="Slide 2" /></div>
    <div class="slide-item"><img src="https://i.pinimg.com/736x/02/99/eb/0299eb634a5d90fb6e3a84587c0b415a.jpg" alt="Slide 3" /></div>
    <div class="slide-item"><img src="https://i.pinimg.com/736x/59/0c/93/590c9307d61abbafaa9f0a2b6069115d.jpg" alt="Slide 4" /></div>
  </div>
  <div class="slider-dots" id="sliderDots">
    <span class="slider-dot active" data-index="0"></span>
    <span class="slider-dot" data-index="1"></span>
    <span class="slider-dot" data-index="2"></span>
    <span class="slider-dot" data-index="3"></span>
  </div>
</div>

<script>
  const track = document.getElementById('sliderTrack');
  const dots = document.querySelectorAll('.slider-dot');
  const slider = document.getElementById('heroSlider');
  let cur = 0, timer;
  function show(i) {
    cur = i;
    track.style.transform = `translateX(-${cur * 100}%)`;
    dots.forEach(d => d.classList.remove('active'));
    dots[cur].classList.add('active');
  }
  function auto() { timer = setInterval(() => show((cur + 1) % 4), 3000); }
  dots.forEach(d => d.onclick = () => show(+d.dataset.index));
  slider.onmouseenter = () => clearInterval(timer);
  slider.onmouseleave = auto;
  auto();
</script>
